<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="miniredis — a Redis-compatible in-memory store in C++ reaching 984K ops/sec">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0a0a"/>
      <stop offset="0.5" stop-color="#0d0d12"/>
      <stop offset="1" stop-color="#12060a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4438"/>
      <stop offset="1" stop-color="#a41e11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4438" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4438" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- dot grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="240" cy="80" r="2"/><circle cx="320" cy="80" r="2"/>
    <circle cx="1040" cy="600" r="2"/><circle cx="1120" cy="600" r="2"/><circle cx="960" cy="600" r="2"/><circle cx="880" cy="600" r="2"/>
  </g>

  <!-- red glow blob -->
  <circle cx="980" cy="180" r="260" fill="url(#glow)"/>

  <!-- title -->
  <text x="80" y="200" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="88" font-weight="800" fill="#f5f5f7">mini<tspan fill="url(#redAccent)">redis</tspan></text>

  <!-- subtitle -->
  <text x="82" y="258" font-family="'Inter',system-ui,sans-serif" font-size="30" font-weight="500" fill="#b5b5bd">Redis-compatible in-memory store — built from scratch in C++17</text>

  <!-- tech chips -->
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="24" font-weight="600">
    <rect x="80" y="320" width="180" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ff4438" stroke-opacity="0.4"/>
    <text x="170" y="354" text-anchor="middle" fill="#f0d0cc">epoll / kqueue</text>

    <rect x="280" y="320" width="150" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ff4438" stroke-opacity="0.4"/>
    <text x="355" y="354" text-anchor="middle" fill="#f0d0cc">RESP proto</text>

    <rect x="450" y="320" width="150" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ff4438" stroke-opacity="0.4"/>
    <text x="525" y="354" text-anchor="middle" fill="#f0d0cc">skip list</text>

    <rect x="620" y="320" width="200" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ff4438" stroke-opacity="0.4"/>
    <text x="720" y="354" text-anchor="middle" fill="#f0d0cc">sharded locks</text>
  </g>

  <!-- big stat -->
  <text x="80" y="500" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="120" font-weight="800" fill="url(#redAccent)">984K</text>
  <text x="82" y="548" font-family="'Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#e5e5ea">ops / sec · 2.5× higher throughput</text>

  <!-- terminal cursor line -->
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="26">
    <text x="80" y="612" fill="#8a8a92">$ redis-cli -p 6380 <tspan fill="#ff5f52">ZADD</tspan> board 984000 mini</text>
    <rect x="640" y="590" width="16" height="30" fill="#ff4438" opacity="0.9"/>
  </g>

  <!-- corner mark -->
  <g transform="translate(1040,470)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#redAccent)"/>
    <text x="44" y="60" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="52" font-weight="800" fill="#12060a">R</text>
  </g>
</svg>
